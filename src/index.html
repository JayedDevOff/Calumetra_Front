<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calumetra</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7540176281628945"
      crossorigin="anonymous"
    ></script>

    <meta
      name="twitter:image"
      content="https://calumetra.com/assets/media/logos/calumetra-small.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/assets/media/logos/calumetra-small.png" />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      #initial-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: loaderFadeIn 0.7s ease;
      }
      /* Logo */
      .loader-logo {
        position: relative;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-logo img {
        position: relative;
        z-index: 2;
        width: 58px;
        height: 58px;
        object-fit: contain;
        animation: logoPulse 2.5s ease-in-out infinite;
      }

      /* Rotating ring */
      .loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.08);
        border-top-color: #e5322d;
        border-right-color: #e5322d;
        animation: ringRotate 1.1s linear infinite;
      }
      /* Brand name */
      .loader-brand {
        margin-top: 18px;
        font-family: 'Orbitron', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #e5322d, #e5322d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      /* Loading text */
      .loader-text {
        display: flex;
        align-items: center;
        margin-top: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: #6b7280;
      }
      .dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 5px;
      }
      .dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #6b7280;
        animation: dotAnimation 1.4s infinite ease-in-out;
      }
      .dots i:nth-child(1) {
        animation-delay: 0s;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes ringRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes logoPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.035);
        }
      }

      @keyframes dotAnimation {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      @keyframes loaderFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      } 
    </style> 
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-content">
        <!-- Logo -->
        <div class="loader-logo">
          <div class="loader-ring"></div>

          <img src="/assets/media/logos/calumetra-loader-img.png" alt="Calumetra" />
        </div>

        <!-- Brand -->
        <div class="loader-brand">Calumetra</div>

        <!-- Loading dots -->
        <div class="loader-text">
          <span>Loading</span>
          <span class="dots">
            <i></i>
            <i></i>
            <i></i>
          </span>
        </div>
      </div>
    </div>

    <app-root></app-root>
  </body>
</html>
